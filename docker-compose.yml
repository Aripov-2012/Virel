version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: virel_postgres
    restart: always
    environment:
      POSTGRES_DB: virel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2012"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: virel_django
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:2012@db:5432/virel_db
    depends_on:
      - db

volumes:
  postgres_data: